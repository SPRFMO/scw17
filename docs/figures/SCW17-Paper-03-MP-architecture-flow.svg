<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Management procedure architecture in jmMSE</title>
  <desc id="desc">Flow diagram showing an operating model and observation error model feeding an estimator, which produces a status or index metric for a harvest control rule. The harvest control rule produces a TAC or catch target that is passed through the implementation system into an MSE projection. Performance metrics and tuning compare the projected outcomes and feed back to the control-rule design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title-text { font: 700 25px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .stage-label { font: 700 14px Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #111827; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .node-note { font: 400 13px Arial, sans-serif; fill: #475569; }
      .link-label { font: 700 12px Arial, sans-serif; fill: #475569; }
      .om { fill: #e0f2fe; stroke: #0284c7; }
      .obs { fill: #dcfce7; stroke: #16a34a; }
      .est { fill: #ede9fe; stroke: #7c3aed; }
      .status { fill: #fef3c7; stroke: #d97706; }
      .hcr { fill: #fce7f3; stroke: #db2777; }
      .catch { fill: #fff7ed; stroke: #ea580c; }
      .impl { fill: #f1f5f9; stroke: #64748b; }
      .run { fill: #e0f2fe; stroke: #2563eb; }
      .metric { fill: #ecfdf5; stroke: #059669; }
      .tune { fill: #f8fafc; stroke: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrow-soft); }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.4; }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
  <text x="40" y="44" class="title-text">Management procedure architecture</text>
  <text x="40" y="72" class="subtitle">An MP combines an estimator, harvest control rule, and implementation system; tuning compares projected outcomes against performance metrics.</text>

  <rect x="40" y="108" width="1120" height="210" rx="10" class="lane"/>
  <rect x="40" y="366" width="1120" height="210" rx="10" class="lane"/>
  <text x="62" y="137" class="stage-label">Information available to the MP</text>
  <text x="62" y="395" class="stage-label">Decision rule, implementation, and evaluation</text>
  <line x1="40" y1="342" x2="1160" y2="342" class="divider"/>

  <g transform="translate(70 168)">
    <rect class="om" x="0" y="0" width="185" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="92.5" y="32" text-anchor="middle">Operating model</text>
    <text class="node-text" x="92.5" y="56" text-anchor="middle">OM</text>
    <text class="node-note" x="92.5" y="78" text-anchor="middle">simulated stock and fleet</text>
  </g>

  <g transform="translate(315 168)">
    <rect class="obs" x="0" y="0" width="185" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="92.5" y="32" text-anchor="middle">Observation model</text>
    <text class="node-text" x="92.5" y="56" text-anchor="middle">OEM</text>
    <text class="node-note" x="92.5" y="78" text-anchor="middle">indices and sampled data</text>
  </g>

  <g transform="translate(560 168)">
    <rect class="est" x="0" y="0" width="205" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="102.5" y="31" text-anchor="middle">Estimator module</text>
    <text class="node-text" x="102.5" y="55" text-anchor="middle">est</text>
    <text class="node-note" x="102.5" y="78" text-anchor="middle">shortcut, CPUE, SPiCT, perfect</text>
  </g>

  <g transform="translate(825 168)">
    <rect class="status" x="0" y="0" width="210" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="105" y="31" text-anchor="middle">Status or index metric</text>
    <text class="node-text" x="105" y="55" text-anchor="middle">depletion, z-score, B</text>
    <text class="node-note" x="105" y="78" text-anchor="middle">input to the HCR</text>
  </g>

  <g transform="translate(70 426)">
    <rect class="hcr" x="0" y="0" width="185" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="92.5" y="31" text-anchor="middle">Harvest control rule</text>
    <text class="node-text" x="92.5" y="55" text-anchor="middle">hcr</text>
    <text class="node-note" x="92.5" y="78" text-anchor="middle">buffer, hockeystick, fixed</text>
  </g>

  <g transform="translate(315 426)">
    <rect class="catch" x="0" y="0" width="185" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="92.5" y="31" text-anchor="middle">Recommended TAC</text>
    <text class="node-text" x="92.5" y="55" text-anchor="middle">or catch target</text>
    <text class="node-note" x="92.5" y="78" text-anchor="middle">with optional TAC caps</text>
  </g>

  <g transform="translate(560 426)">
    <rect class="impl" x="0" y="0" width="185" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="92.5" y="31" text-anchor="middle">Implementation system</text>
    <text class="node-text" x="92.5" y="55" text-anchor="middle">isys</text>
    <text class="node-note" x="92.5" y="78" text-anchor="middle">split, bank, borrow</text>
  </g>

  <g transform="translate(805 426)">
    <rect class="run" x="0" y="0" width="160" height="96" rx="8" stroke-width="2"/>
    <text class="node-title" x="80" y="31" text-anchor="middle">Projected run</text>
    <text class="node-text" x="80" y="55" text-anchor="middle">MSE output</text>
    <text class="node-note" x="80" y="78" text-anchor="middle">stock, catch, advice</text>
  </g>

  <g transform="translate(1010 390)">
    <rect class="metric" x="0" y="0" width="135" height="78" rx="8" stroke-width="2"/>
    <text class="node-title" x="67.5" y="28" text-anchor="middle">Performance</text>
    <text class="node-text" x="67.5" y="52" text-anchor="middle">metrics</text>
  </g>

  <g transform="translate(1010 500)">
    <rect class="tune" x="0" y="0" width="135" height="78" rx="8" stroke-width="2"/>
    <text class="node-title" x="67.5" y="28" text-anchor="middle">Tuning and</text>
    <text class="node-text" x="67.5" y="52" text-anchor="middle">comparison</text>
  </g>

  <path class="arrow" d="M 255 216 H 315"/>
  <path class="arrow" d="M 500 216 H 560"/>
  <path class="arrow" d="M 765 216 H 825"/>
  <path class="arrow" d="M 930 264 C 930 330 162 330 162 426"/>
  <path class="arrow" d="M 255 474 H 315"/>
  <path class="arrow" d="M 500 474 H 560"/>
  <path class="arrow" d="M 745 474 H 805"/>
  <path class="arrow" d="M 965 474 H 1010"/>
  <path class="arrow-soft" d="M 1078 578 V 610 C 1078 636 160 636 160 522"/>

  <text class="link-label" x="285" y="204" text-anchor="middle">observe</text>
  <text class="link-label" x="530" y="204" text-anchor="middle">estimate</text>
  <text class="link-label" x="795" y="204" text-anchor="middle">summarize</text>
  <text class="link-label" x="690" y="320" text-anchor="middle">metric used by HCR</text>
  <text class="link-label" x="285" y="462" text-anchor="middle">advice</text>
  <text class="link-label" x="530" y="462" text-anchor="middle">allocate</text>
  <text class="link-label" x="775" y="462" text-anchor="middle">project</text>
  <text class="link-label" x="988" y="462" text-anchor="middle">score</text>
  <rect x="394" y="590" width="432" height="24" fill="#ffffff" opacity="0.94"/>
  <text class="link-label" x="610" y="606" text-anchor="middle">performance feedback informs tuning and candidate MP comparison</text>
</svg>
